<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <h1>Employee Management System</h1>

    <nav>

        <a href="/">Home</a>
        <a href="/employees">Employees</a>

    </nav>

</header>

<main class="employee-page">

    <h2 th:text="${employee.employeeId != null} ? 'Edit Employee' : 'Add New Employee'">
        Add New Employee
    </h2>

    <form class="employee-form"
          th:action="@{/saveEmployee}"
          th:object="${employee}"
          method="post"
          enctype="multipart/form-data">

        <label for="empId">Employee ID</label>
        <input type="number"
               id="empId"
               th:field="*{employeeId}"
               placeholder="Enter Employee ID"
               required>

        <label for="firstName">First Name</label>
        <input type="text"
               id="firstName"
               th:field="*{firstName}"
               placeholder="Enter First Name"
               required>

        <label for="lastName">Last Name</label>
        <input type="text"
               id="lastName"
               th:field="*{lastName}"
               placeholder="Enter Last Name"
               required>

        <label for="department">Department</label>
        <input type="text"
               id="department"
               th:field="*{department}"
               placeholder="Enter Department"
               required>

        <label for="email">Email</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="Enter Email"
               required>

        <label for="resume">Resume</label>
        <input type="file"
               id="resume"
               name="resumeFile"
               accept=".pdf,.doc,.docx">

        <!-- Display current uploaded resume -->
        <div th:if="${employee.resumeFileName != null and !#strings.isEmpty(employee.resumeFileName)}"
     style="margin-top:10px; padding:10px; background:#f5f5f5; border-radius:6px;">

    <strong>Current Resume:</strong><br><br>

    📄
    <a th:href="@{/resume/{fileName}(fileName=${employee.resumeFileName})}"
       th:text="${employee.resumeFileName}"
       target="_blank">
    </a>

</div>

        <br>

        <button type="submit">
            Save Employee
        </button>

    </form>

</main>

</body>

</html>
